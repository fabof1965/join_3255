<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Login</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./styles/standart.css">
    <link rel="stylesheet" href="./styles/login.css">

    <script src="./script.js"></script>
</head>

<body>

    <main class="log-in-main">
        <section class="log-in-section">
            <h2 class="log-in-heading">Log in</h2>

            <form class="log-in-form">

                <div class="login-area">
                    <div class="input-wrapper">
                        <label for="email" class="visually-hidden">Email</label>
                        <input id="email" class="login-input-field" type="email" placeholder="Email" required>
                        <img src="./assets/icons/mail.svg" alt="mail icon">
                    </div>
                    <div class="input-wrapper">
                        <label class="visually-hidden" for="password">Passwort</label>
                        <input id="password" class="login-input-field" type="password" placeholder="Passwort">
                        <img src="./assets/icons/lock.svg" alt="lock icon">
                    </div>
                </div>

                <div class="submit-btn-container">
                    <button type="button">Log in</button>
                    <button type="button">Guest log in</button>
                </div>
            </form>

            <div class="submit-btn-wrapper">

            </div>
        </section>


    </main>

</body>

</html>
