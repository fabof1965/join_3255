<!doctype html>
<html lang="de">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join Login</title>
    <link rel="shortcut icon" href="./assets/icons/logo-blue.svg">
    <link rel="stylesheet" href="./styles/root.css" />
    <link rel="stylesheet" href="./styles/typography.css" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./styles/login.css" />
    <link rel="stylesheet" href="./styles/signup.css">

    <script src="./scripts/firebase.js" defer></script>
    <script src="./script.js" defer></script>
    <script src="./scripts/loginAndSignUp.js" defer></script>
</head>

<body class="auth-body">
    <div class="logo-animation">
        <svg id="logo" class="logo-animation-white" width="120" viewBox="0 0 265 324"
            xmlns="http://www.w3.org/2000/svg">
            <path class="logo-path" d="M189.866 0H131.168V67.5315H189.866V0Z" fill="" />
            <path class="logo-path"
                d="M131.168 122.455H189.866V217.697C190.135 240.615 183.612 263.096 171.128 282.281C158.801 300.921 135.006 323.099 90.9823 323.099C43.0303 323.099 15.0809 300.422 0 287.995L37.0251 242.324C51.7448 254.343 65.9227 264.23 91.2081 264.23C110.353 264.23 117.983 256.429 122.454 249.626C128.531 240.177 131.674 229.126 131.484 217.879L131.168 122.455Z"
                fill="" />
            <path class="logo-path" d="M101.232 79.8223H42.5337V138.782H101.232V79.8223Z" fill="" />
            <path class="logo-path"
                d="M220.615 295.433C220.615 307.996 214.249 314.754 205.354 314.754C196.459 314.754 190.634 306.726 190.634 296.068C190.634 285.41 196.639 276.974 205.85 276.974C215.062 276.974 220.615 285.274 220.615 295.433ZM197.452 295.932C197.452 303.506 200.477 309.084 205.67 309.084C210.862 309.084 213.797 303.189 213.797 295.478C213.797 288.721 211.088 282.371 205.67 282.371C200.252 282.371 197.452 288.494 197.452 295.932Z"
                fill="" />
            <path class="logo-path" d="M232.264 277.519V314.164H225.762V277.519H232.264Z" fill="" />
            <path class="logo-path"
                d="M239.308 314.164V277.519H246.532L254.299 292.621C256.298 296.57 258.077 300.628 259.627 304.776C259.22 300.241 259.04 295.025 259.04 289.22V277.519H265V314.164H258.272L250.416 298.744C248.336 294.693 246.481 290.529 244.862 286.272C244.862 290.807 245.178 295.932 245.178 302.236V314.119L239.308 314.164Z"
                fill="" />
        </svg>
    </div>
    <header class="auth-header content-wrapper">
        <div class="spacing"></div>
        <div id="signup-wrapper" class="auth-wrapper">
            <p>Not a join user ?</p>
            <button onclick="addSignupContent()" id="sign-up-btn" class="auth-btn btn">Sign up</button>
        </div>
    </header>

    <main class="auth-main content-wrapper">
        <form onsubmit="userLogin(event)" id="auth-form" class="auth-form">
            <header class="form-header">
                <button onclick="backToLogin()" id="btn-show-login" type="button"
                    class="arrow-back-btn">
                    <img src="./assets/icons/arrow-left-line.png" alt="back-to-login">
                </button>
                <div class="heading-wrapper">
                    <div class="heading-container">
                        <h2 id="heading" class="auth-heading">Log in</h2>
                        <hr class="headline-underline" />
                    </div>
                </div>
            </header>

            <div id="formInputContainer" class="auth-input-container">
                <div class="input-wrapper">
                    <label for="email" class="visually-hidden">Email</label>
                    <input id="email" class="input-field" type="email" placeholder="Email" required />
                    <img src="./assets/icons/mail.svg" alt="mail icon" />
                </div>
                <div class="input-wrapper">
                    <label for="login-password" class="visually-hidden">Passwort</label>
                    <input id="login-password" class="input-field" type="password" placeholder="Passwort" required />
                    <img id="login-password-toggle-icon" class="lock-img" src="./assets/icons/lock.svg"
                        alt="lock icon" />
                </div>
            </div>

            <div id="checkbox-container">
                <input class="checkbox" type="checkbox" id="checkbox">
                <span>I accept the <a class="privacy-policy-link" data-text="Privacy Policy"
                        href="./pages/privacy_policy.html">Privacy Policy</a></span>
            </div>

            <div id="signup-btn-container" class="sign-up-button-container">
                <button type="submit" class="btn auth-btn">Sign up</button>
            </div>

            <div id="submit-btn-container" class="submit-btn-container">
                <button class="auth-btn btn">Log in</button>
                <button onclick="logInGuestUser()" type="button" class="guest-login-btn btn">Guest log in</button>
            </div>
        </form>
    </main>

    <footer class="auth-footer">
        <div class="legal-wrapper">
            <a class="legal-link-login" href="./pages/privacy_policy.html">Privacy Policy</a>
            <a class="legal-link-login" href="./pages/legal_notice.html">Legal Notice</a>
        </div>
    </footer>

    <dialog id="dialog" class="auth-dialog">
        <h2>You Signed Up successfully</h2>
    </dialog>
</body>

</html>
