<!doctype html>
<html lang="de">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join Login</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./styles/standart.css" />
    <link rel="stylesheet" href="./styles/login.css" />
    <link rel="stylesheet" href="./styles/root.css" />
    <link rel="stylesheet" href="./styles/typography.css" />

    <script src="./script.js" defer></script>
    <script src="./scripts/login.js" defer></script>
</head>

<body class="login-body">
    <div class="logo-animation">
        <img class="logo-animation-white" src="./assets/icons/logo-white.svg" alt="white join logo" />
        <img class="logo-animation-blue" src="./assets/icons/logo-blue.svg" alt="blue join logo" />
    </div>

    <header class="login-header content-wrapper">
        <img src="./assets/img/join-logo.jpg" alt="join logo" />

        <div class="sign-up-container">
            <div class="sign-up-wrapper">
                <p>Not a join user ?</p>
                <button id="sign-up-btn" class="login-btn btn">Sign up</button>
            </div>
        </div>
    </header>

    <main class="log-in-main">
        <section class="log-in-section">
            <form onsubmit="userLogin(event)" id="log-in-form" class="log-in-form">
                <div class="heading-container">
                    <h2 class="log-in-heading">Log in</h2>
                    <hr class="headline-underline" />
                </div>

                <div class="login-area">
                    <div class="input-wrapper">
                        <label for="email" class="visually-hidden">Email</label>
                        <input id="email" class="login-input-field" type="email" placeholder="Email" required />
                        <img src="./assets/icons/mail.svg" alt="mail icon" />
                    </div>
                    <div class="input-wrapper">
                        <label class="visually-hidden" for="password">Passwort</label>
                        <input id="password" class="login-input-field" type="password" placeholder="Passwort"
                            required />
                        <img src="./assets/icons/lock.svg" alt="lock icon" />
                    </div>
                </div>

                <div class="submit-btn-container">
                    <button class="login-btn btn">Log in</button>
                    <button class="submit-btn btn">Guest log in</button>
                </div>
            </form>
        </section>
    </main>

    <footer class="login-footer">
        <div class="legal-wrapper">
            <a class="legal-link" href="#">Privacy Policy</a>
            <a class="legal-link" href="#">Legal Notice</a>
        </div>
    </footer>
</body>

</html>
