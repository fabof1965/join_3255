<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Login</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./styles/standart.css">
    <link rel="stylesheet" href="./styles/login.css">

    <script src="./script.js"></script>
</head>

<body>

    <main class="log-in-main">
        <section class="log-in-section">
            <form class="log-in-form">
                <h2 class="log-in-heading">Log in</h2>
            <div class="login-area">
                <label for="email"><input type="email" placeholder="Email"></label>
                <label for="password"><input type="password" placeholder="Passwort"></label>
            </div>
            <button type="button">Log in</button>
            <button type="button">Guest log in</button>

            </form>
        </section>


    </main>

</body>

</html>
