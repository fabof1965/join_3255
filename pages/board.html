<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join Board</title>
    <link
      rel="shortcut icon"
      href="../assets/icons/logo-blue.svg"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../styles/root.css" />
    <link rel="stylesheet" href="../styles/standart.css" />
    <link rel="stylesheet" href="../styles/header.css" />
    <link rel="stylesheet" href="../styles/sidebar.css" />
    <link rel="stylesheet" href="../styles/board.css" />
    <script src="../scripts/template.js"></script>
  </head>
  <body>
    <div id="header"></div>

    <div class="main-layout">
      <div id="sidebar"></div>

      <main class="board-container">
        <div class="board-toolbar">
          <div class="board-search">
            <input type="text" placeholder="Find Task" />
            <button
              type="button"
              class="search-button"
              aria-label="Search Tasks"
            ></button>
          </div>
          <button type="button" class="add-task-button">Add Task +</button>
        </div>
        <div class="board-columns">
          <section class="board-column">
            <header class="column-header">
              <h2>To do</h2>
              <button type="button">+</button>
            </header>
            <div
              class="task-list"
              data-status="toDo"
              data-empty-text="No tasks To do"
            ></div>
          </section>
          <section class="board-column">
            <header class="column-header">
              <h2>In progress</h2>
              <button type="button">+</button>
            </header>
            <div
              class="task-list"
              data-status="inProgress"
              data-empty-text="No tasks in progress"
            ></div>
          </section>
          <section class="board-column">
            <header class="column-header">
              <h2>Await feedback</h2>
              <button type="button">+</button>
            </header>
            <div
              class="task-list"
              data-status="awaitFeedback"
              data-empty-text="No tasks awaiting feedback"
            ></div>
          </section>
          <section class="board-column">
            <header class="column-header">
              <h2>Done</h2>
              <button type="button">+</button>
            </header>
            <div
              class="task-list"
              data-status="done"
              data-empty-text="No tasks done"
            ></div>
          </section>
        </div>
      </main>
    </div>

    <script src="../script.js"></script>
    <script src="../scripts/board.js"></script>
  </body>
</html>
