<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="shortcut icon" href="../assets/icons/logo-blue.svg" type="image/x-icon">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../styles/standart.css">
    <link rel="stylesheet" href="../styles/register.css">
    <link rel="stylesheet" href="../styles/root.css">
    <link rel="stylesheet" href="../styles/typography.css">

    <script src="../script.js" defer></script>
    <script src="../scripts/firebase.js" defer></script>
</head>

<body class="register-body">
    <header class="register-header">
        <div class="register-header-wrapper">
            <img src="../assets/img/join-logo-white.png" alt="join logo white">
        </div>
    </header>

    <main class="register-body">

        <form class="sign-up-form">
            <div class="sign-up-header-wrapper">
                <div class="sign-up-button-container">
                    <button type="button" id="arrow-back" class="btn"><img src="../assets/icons/arrow-left-line.png"
                            alt="arrow-left"></button>
                </div>
                <div class="sign-up-heading-container">
                    <h1>Sign up</h1>
                </div>
            </div>
            <div>
                <div class="register-input-container"><input type="name" id="name" required></div>
                <div class="register-input-container"><input type="email" id="email" required></div>
                <div class="register-input-container"><input type="password" id="password" required></div>
                <div class="register-input-container"><input type="password" id="confirm-password" required></div>
            </div>
        </form>
    </main>

    <footer class="register-footer">
        <div class="legal-wrapper">
            <a class="legal-link-register" href="#">Privacy Policy</a>
            <a class="legal-link-register" href="#">Legal Notice</a>
        </div>
    </footer>

</body>

</html>
