<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>
    <link rel="shortcut icon" href="../assets/icons/logo-blue.svg" type="image/x-icon">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../styles/standard.css">
    <link rel="stylesheet" href="../styles/signup.css">
    <link rel="stylesheet" href="../styles/root.css">
    <link rel="stylesheet" href="../styles/typography.css">

    <script src="../script.js" defer></script>
    <script src="../scripts/firebase.js" defer></script>
    <script src="../scripts/signup.js" defer></script>
</head>

<body class="sign-up-body">
    <header class="sign-up-header">

        <div>
            <svg width="120" height="100" viewBox="0 0 265 324" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M189.866 0H131.168V67.5315H189.866V0Z" fill="white" />
                <path
                    d="M131.168 122.455H189.866V217.697C190.135 240.615 183.612 263.096 171.128 282.281C158.801 300.921 135.006 323.099 90.9823 323.099C43.0303 323.099 15.0809 300.422 0 287.995L37.0251 242.324C51.7448 254.343 65.9227 264.23 91.2081 264.23C110.353 264.23 117.983 256.429 122.454 249.626C128.531 240.177 131.674 229.126 131.484 217.879L131.168 122.455Z"
                    fill="white" />
                <path d="M101.232 79.8223H42.5337V138.782H101.232V79.8223Z" fill="white" />
                <path
                    d="M220.615 295.433C220.615 307.996 214.249 314.754 205.354 314.754C196.459 314.754 190.634 306.726 190.634 296.068C190.634 285.41 196.639 276.974 205.85 276.974C215.062 276.974 220.615 285.274 220.615 295.433ZM197.452 295.932C197.452 303.506 200.477 309.084 205.67 309.084C210.862 309.084 213.797 303.189 213.797 295.478C213.797 288.721 211.088 282.371 205.67 282.371C200.252 282.371 197.452 288.494 197.452 295.932Z"
                    fill="white" />
                <path d="M232.264 277.519V314.164H225.762V277.519H232.264Z" fill="white" />
                <path
                    d="M239.308 314.164V277.519H246.532L254.299 292.621C256.298 296.57 258.077 300.628 259.627 304.776C259.22 300.241 259.04 295.025 259.04 289.22V277.519H265V314.164H258.272L250.416 298.744C248.336 294.693 246.481 290.529 244.862 286.272C244.862 290.807 245.178 295.932 245.178 302.236V314.119L239.308 314.164Z"
                    fill="white" />
            </svg>
        </div>
    </header>

    <main class="sign-up-main">

        <form id="signUpForm" class="sign-up-form">
            <div class="sign-up-header-wrapper">
                <div>
                    <button onclick="backtoLogin()" type="button" id="arrow-back" class="btn"><img
                            src="../assets/icons/arrow-left-line.png" alt="arrow-left"></button>
                </div>
                <div class="sign-up-heading-container">
                    <h1 class="sign-up-heading">Sign up</h1>
                    <hr class="headline-underline" />
                </div>
            </div>
            <div class="sign-up-input-container-wrapper">
                <div class="sign-up-input-container"><input class="input-field" type="name" id="name" placeholder="Name"
                        required><img src="../assets/icons/person.svg" alt="person logo"></div>

                <div class="sign-up-input-container"><input class="input-field" type="email" id="email"
                        placeholder="Email"><img src="../assets/icons/mail.svg" alt="mail logo"></div>

                <div class="sign-up-input-container"><input class="input-field" type="password" id="password" required
                        placeholder="Password">
                    <img id="password-toggle-icon" onclick="toggleShowPassword()" class="lock-img"
                        src="../assets/icons/lock.svg" alt="lock-img">
                </div>

                <div class="sign-up-input-container"><input class="input-field" type="password" id="confirm-password"
                        required placeholder="Confirm Password"><img src="../assets/icons/lock.svg" alt="lock logo">
                </div>
            </div>

            <div class="checkbox-container">
                <input class="checkbox" type="checkbox" id="checkbox">
                <p>I accept the <a class="privacy-policity-link" href="#">Privacy policity</a></p>
            </div>

            <div class="sign-up-button-container">
                <button onclick="registerUser(event)" type="submit" class="btn auth-btn">Sign-up</button>
            </div>
        </form>
    </main>

    <footer class="sign-up-footer">
        <div class="legal-wrapper">
            <a class="legal-link-sign-up" href="#">Privacy Policy</a>
            <a class="legal-link-sign-up" href="#">Legal Notice</a>
        </div>
    </footer>

</body>

</html>
