<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join-Summary</title>
    <link
      rel="shortcut icon"
      href="../assets/icons/logo-blue.svg"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="../styles/standart.css" />
    <link rel="stylesheet" href="../styles/summary.css" />
    <link rel="stylesheet" href="../styles/sidebar-test.css" />
    <script src="../scripts/template.js"></script>
  </head>

  <body>
    <div class="main-layout">
      <div id="sidebar"></div>
      <div class="content-wrapper">
        <div class="summary-container">
          <div class="greeting">
            <span class="greeting-text">Good morning,</span>
            <span class="username" id="username">Sofia Müller</span>
          </div>

          <div class="summary-row">
            <div class="card card-blue-large">
              <div class="card-left">
                <div class="card-content-top">
                  <img
                    src="../assets/icons/tasks_urgent.png"
                    alt="Urgent Icon"
                  />
                  <span class="card-number">1</span>
                </div>
                <span class="card-label">Tasks Urgent</span>
              </div>

              <div class="card-divider"></div>

              <div class="card-right">
                <span class="card-date">October 16, 2022</span>
                <span class="card-subtext">Upcoming Deadline</span>
              </div>
            </div>

            <div class="card card-top-right">
              <div class="card-content-top">
                <img src="../assets/icons/task_in_board.png" alt="Board Icon" />
                <span class="card-number dark">5</span>
              </div>
              <span class="card-label blue-text">Task in Board</span>
            </div>
          </div>

          <div class="summary-row">
            <div class="card card-light-blue">
              <div class="card-content-top">
                <img src="../assets/icons/task_to_do.png" alt="To-do Icon" />
                <span class="card-number dark">1</span>
              </div>
              <span class="card-label blue-text">Tasks To-do</span>
            </div>

            <div class="card card-white">
              <div class="card-content-top">
                <img
                  src="../assets/icons/task_in_progress1X.png"
                  alt="Progress Icon"
                />
                <span class="card-number dark">2</span>
              </div>
              <span class="card-label blue-text">Task in Progress</span>
            </div>

            <div class="card card-white">
              <div class="card-content-top">
                <img
                  src="../assets/icons/awaiting_feedback.png"
                  alt="Feedback Icon"
                />
                <span class="card-number dark">2</span>
              </div>
              <span class="card-label blue-text">Awaiting Feedback</span>
            </div>

            <div class="card card-white">
              <div class="card-content-top">
                <img src="../assets/icons/task_done.png" alt="Done Icon" />
                <span class="card-number dark">1</span>
              </div>
              <span class="card-label blue-text">Tasks Done</span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="../script.js"></script>
  </body>
</html>
