<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join - Summary</title>
    <link rel="shortcut icon" href="../assets/icons/logo-blue.svg" type="image/x-icon" />
    <link rel="stylesheet" href="../styles/root.css" />
    <link rel="stylesheet" href="../styles/typography.css" />
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../styles/header.css" />
    <link rel="stylesheet" href="../styles/sidebar.css" />
    <link rel="stylesheet" href="../styles/summary.css" />
    <script src="../scripts/template.js" defer></script>
    <script src="../script.js" defer></script>
    <script src="../scripts/firebase.js" defer></script>
    <script src="../scripts/summary.js" defer></script>
</head>

<body style="display: none">
    <header class="header" id="header"></header>
    <main class="main-layout">
        <nav id="sidebar"></nav>
        <section class="summary-container">
            <div class="greeting-container">
                <div class="greeting">
                    <span id="greeting" class="greeting-text"></span>
                    <span id="comma" style="display: none;">,&nbsp;</span>
                </div>
                <span id="username" class="username"></span>
            </div>

            <section class="summary-card-container">
                <div class="blue-head-column">
                    <div class="urgent-task">
                        <div class="icon-and-number">
                            <img class="task-icons" src="../assets/icons/tasks_urgent.png" alt="task urgent icon">
                            <span class="task-number" id="summary-urgent"></span>
                        </div>
                        <label class="sub-text" id="lbl-urgent-task" for="summary-urgent">Tasks Urgent</label>
                    </div>

                    <div class="divider"></div>

                    <div class="deadline-container">
                        <div class="date">
                            <span id="date" class="date-text"></span>
                            <span id="deadline-info" class="sub-text"></span>
                        </div>
                    </div>

                </div>
                <div class="tasks-to-do">
                    <div class="icon-and-number">
                        <img class="task-icons" src="../assets/icons/task_to_do.png" alt="task todo icon">
                        <span class="task-number" id="summary-todo"></span>
                    </div>
                    <label class="sub-text" for="summary-todo">Tasks To-do</label>
                </div>

                <div class="task-in-progress">
                    <div class="icon-and-number">
                        <img class="task-icons" src="../assets/icons/task_in_progress1X.png" alt="task in progress icon">
                        <span class="task-number" id="summary-inprogress"></span>
                    </div>
                    <label class="sub-text" for="summary-inprogress">Task in <br> Progress</label>
                </div>

                <div class="task-feedback">
                    <div class="icon-and-number">
                        <img class="task-icons" src="../assets/icons/awaiting_feedback.png" alt="task await feedback icon">
                        <span class="task-number" id="summary-feedback"></span>
                    </div>
                    <label class="sub-text" for="summary-feedback">Awaiting <br> Feedback</label>
                </div>

                <div class="task-in-board">
                    <div class="icon-and-number">
                        <img class="task-icons" src="../assets/icons/task_in_board.png" alt="task in board icon">
                        <span class="task-number" id="summary-board"></span>
                    </div>
                    <label class="sub-text" for="summary-board">Tasks in <br> Board</label>
                </div>
                <div class="tasks-done">
                    <div class="icon-and-number">
                        <img class="task-icons" src="../assets/icons/task_done.png" alt="task done icon">
                        <span class="task-number" id="summary-done"></span>
                    </div>
                    <label class="sub-text" for="summary-done">Tasks <br>Done</label>
                </div>
                </div>
            </section>
        </section>
    </main>
</body>

</html>
